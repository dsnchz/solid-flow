name: CI
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Lint Check
        run: bun run lint
      - name: Format Check
        run: bun run format
      - name: Type Check
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Test (SSR)
        run: bun run test:ssr
      - name: Test (hydration)
        run: bun run test:hydration
      - name: Build
        run: bun run build

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # Boots the playground (:3010) and the SSR smoke app (:3020) from
      # playwright.config.ts; the opt-in perf specs stay excluded.
      - name: E2E
        run: bun run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
